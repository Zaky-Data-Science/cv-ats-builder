<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1032" viewBox="0 0 1000 1032" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>Workflow pengembangan dan rilis</title>
<desc>Gerbang kualitas dijalankan di komputer sendiri sebelum kode dikirim, bukan hanya mengandalkan hasil build di server - kegagalan yang tertangkap lebih awal jauh lebih murah diperbaiki.</desc>
<defs><marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74747a"/></marker></defs>
<rect width="1000" height="1032" fill="#ffffff"/>
<text x="40" y="60" font-size="20" font-weight="700" fill="#0a0a0b">Workflow pengembangan dan rilis</text>
<line x1="40" y1="74" x2="960" y2="74" stroke="#e6e6e8" stroke-width="1"/>
<path d="M 500 174 V 212" fill="none" stroke="#74747a" stroke-width="1.6" marker-end="url(#panah)"/>
<path d="M 500 280 V 303 H 284 V 318" fill="none" stroke="#74747a" stroke-width="1.6" marker-end="url(#panah)"/>
<rect x="352" y="294" width="80" height="18" rx="9" fill="#ffffff"/>
<text x="392" y="307" text-anchor="middle" font-size="11.5" fill="#52525a">ya</text>

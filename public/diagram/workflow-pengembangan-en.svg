<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1016" viewBox="0 0 1000 1016" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>Development and release workflow</title>
<desc>The quality gate runs locally before anything is pushed rather than relying on the server build alone - a failure caught early is far cheaper to fix.</desc>
<defs><marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#74747a"/></marker></defs>
<rect width="1000" height="1016" fill="#ffffff"/>
<text x="40" y="60" font-size="20" font-weight="700" fill="#0a0a0b">Development and release workflow</text>
<line x1="40" y1="74" x2="960" y2="74" stroke="#e6e6e8" stroke-width="1"/>
<path d="M 500 174 V 212" fill="none" stroke="#74747a" stroke-width="1.6" marker-end="url(#panah)"/>
<path d="M 500 280 V 303 H 284 V 318" fill="none" stroke="#74747a" stroke-width="1.6" marker-end="url(#panah)"/>
<rect x="352" y="294" width="80" height="18" rx="9" fill="#ffffff"/>
<text x="392" y="307" text-anchor="middle" font-size="11.5" fill="#52525a">yes</text>
<path d="M 284 424 V 447 H 500 V 462" fill="none" stroke="#74747a" stroke-width="1.6" marker-end="url(#panah)"/>
<path d="M 500 280 V 462" fill="none" stroke="#74747a" stroke-width="1.6" marker-end="url(#panah)"/>
<text x="508" y="379" font-size="11.5" fill="#52525a">no</text>
<path d="M 500 530 V 568" fill="none" stroke="#74747a" stroke-width="1.6" marker-end="url(#panah)"/>
<path d="M 290 606 H 88 V 144 H 290" fill="none" stroke="#74747a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#panah)"/>
<path d="M 500 636 V 674" fill="none" stroke="#74747a" stroke-width="1.6" marker-end="url(#panah)"/>
<text x="508" y="663" font-size="11.5" fill="#52525a">yes</text>
<path d="M 500 742 V 780" fill="none" stroke="#74747a" stroke-width="1.6" marker-end="url(#panah)"/>
<path d="M 500 870 V 908" fill="none" stroke="#74747a" stroke-width="1.6" marker-end="url(#panah)"/>
<rect x="290" y="114" width="420" height="60" rx="10" fill="#0a0a0b" stroke="#0a0a0b" stroke-width="2"/>
<text x="308" y="138" font-size="10" letter-spacing="0.08em" fill="#c9c9cd">START</text>
<text x="308" y="155" font-size="15" font-weight="600" fill="#ffffff">Change the code</text>
<rect x="290" y="220" width="420" height="60" rx="22" fill="#f4f4f5" stroke="#a1a1a8" stroke-width="2"/>
<text x="308" y="244" font-size="10" letter-spacing="0.08em" fill="#52525a">DECISION</text>
<text x="308" y="261" font-size="15" font-weight="600" fill="#0a0a0b">Did the database schema change?</text>
<rect x="114" y="326" width="340" height="98" rx="10" fill="#ffffff" stroke="#d2d2d6" stroke-width="2"/>
<text x="132" y="350" font-size="10" letter-spacing="0.08em" fill="#52525a">PROCESS</text>
<text x="132" y="367" font-size="15" font-weight="600" fill="#0a0a0b">Write the migration file by hand</text>
<text x="132" y="390" font-size="12.5" fill="#52525a">prisma migrate dev is never used on the local</text>
<text x="132" y="406" font-size="12.5" fill="#52525a">database - it wipes the contents.</text>
<rect x="290" y="470" width="420" height="60" rx="10" fill="#ffffff" stroke="#d2d2d6" stroke-width="2"/>
<text x="308" y="494" font-size="10" letter-spacing="0.08em" fill="#52525a">PROCESS</text>
<text x="308" y="511" font-size="15" font-weight="600" fill="#0a0a0b">typecheck, lint, build</text>
<rect x="290" y="576" width="420" height="60" rx="22" fill="#f4f4f5" stroke="#a1a1a8" stroke-width="2"/>
<text x="308" y="600" font-size="10" letter-spacing="0.08em" fill="#52525a">DECISION</text>
<text x="308" y="617" font-size="15" font-weight="600" fill="#0a0a0b">All three pass?</text>
<rect x="290" y="682" width="420" height="60" rx="10" fill="#ffffff" stroke="#d2d2d6" stroke-width="2"/>
<text x="308" y="706" font-size="10" letter-spacing="0.08em" fill="#52525a">PROCESS</text>
<text x="308" y="723" font-size="15" font-weight="600" fill="#0a0a0b">Commit and push to main</text>
<rect x="290" y="788" width="420" height="82" rx="10" fill="#ffffff" stroke="#d2d2d6" stroke-width="2"/>
<text x="308" y="812" font-size="10" letter-spacing="0.08em" fill="#52525a">PROCESS</text>
<text x="308" y="829" font-size="15" font-weight="600" fill="#0a0a0b">Vercel rebuilds</text>
<text x="308" y="852" font-size="12.5" fill="#52525a">prisma generate, prisma migrate deploy, then next build.</text>
<rect x="290" y="916" width="420" height="60" rx="10" fill="#ffffff" stroke="#0a0a0b" stroke-width="3"/>
<text x="308" y="940" font-size="10" letter-spacing="0.08em" fill="#52525a">END</text>
<text x="308" y="957" font-size="15" font-weight="600" fill="#0a0a0b">Live in production</text>
<rect x="47.9" y="365" width="80.2" height="20" rx="10" fill="#ffffff" stroke="#e6e6e8"/>
<text x="88" y="379" text-anchor="middle" font-size="11.5" fill="#52525a">no - fix it</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1266" viewBox="0 0 1000 1266" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>Alur pengguna: membandingkan dan memindai CV</title>
<desc>Seluruh langkah pada alur ini berjalan di dalam peramban pengguna. Tidak ada berkas yang dikirim ke server, sehingga tidak ada pula yang tersimpan.</desc>

<text x="308" y="766" font-size="10" letter-spacing="0.08em" fill="#52525a">DI PERAMBAN</text>
<text x="308" y="783" font-size="15" font-weight="600" fill="#0a0a0b">Nilai tiap CV - lima hal yang dinilai</text>

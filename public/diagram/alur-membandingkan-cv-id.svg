<text x="308" y="478" font-size="10" letter-spacing="0.08em" fill="#52525a">DI PERAMBAN</text>
<text x="308" y="495" font-size="15" font-weight="600" fill="#0a0a0b">Ekstraksi teks di peramban</text>
<text x="308" y="518" font-size="12.5" fill="#52525a">PDF lewat pdf.js; DOCX dibuka sebagai arsip zip lalu</text>
<text x="308" y="534" font-size="12.5" fill="#52525a">XML-nya dibaca.</text>
<rect x="290" y="598" width="420" height="98" rx="10" fill="#fafafa" stroke="#d2d2d6" stroke-width="2"/>
<text x="308" y="622" font-size="10" letter-spacing="0.08em" fill="#52525a">DI PERAMBAN</text>
<text x="308" y="639" font-size="15" font-weight="600" fill="#0a0a0b">Deteksi jumlah halaman dan kolom</text>
<text x="308" y="662" font-size="12.5" fill="#52525a">Celah kosong yang membelah halaman menandakan tata letak</text>
<text x="308" y="678" font-size="12.5" fill="#52525a">dua kolom.</text>
